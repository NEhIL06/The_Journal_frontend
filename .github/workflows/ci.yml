name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Maven tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/journaling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Test and package
        run: ./mvnw --batch-mode verify
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/journaling/target/surefire-reports

  angular:
    name: Angular tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: angular-frontend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build
      - name: Upload Angular bundle
        uses: actions/upload-artifact@v4
        with:
          name: angular-production-build
          path: angular-frontend/dist/angular-frontend/browser
